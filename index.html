<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הלוח שלי</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    /* ─── LINKS ─── */
    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 32px;
    }

    .link-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 8px 16px;
      text-decoration: none;
      color: #cbd5e1;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      cursor: pointer;
      position: relative;
    }

    .link-chip:hover { background: #2d3f55; border-color: #60a5fa; color: #f0f9ff; }

    .link-chip .del-link {
      display: none;
      position: absolute;
      top: -6px;
      left: -6px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
      z-index: 2;
    }

    .link-chip:hover .del-link { display: block; }

    .link-chip .favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }

    .add-link-btn {
      background: transparent;
      border: 1px dashed #475569;
      border-radius: 999px;
      padding: 8px 16px;
      color: #64748b;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .add-link-btn:hover { border-color: #60a5fa; color: #60a5fa; }

    /* ─── MODAL ─── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal h3 { color: #f1f5f9; font-size: 1rem; }

    .modal input {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      color: #e2e8f0;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      direction: ltr;
    }

    .modal input:focus { border-color: #60a5fa; }

    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }

    .btn-primary {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: #2563eb; }

    .btn-ghost {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .btn-ghost:hover { border-color: #60a5fa; color: #e2e8f0; }

    /* ─── TASKS ─── */
    .tasks-layout {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (max-width: 700px) {
      .tasks-layout { grid-template-columns: 1fr; }
    }

    .task-col {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-col-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .col-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .col-dot.red   { background: #ef4444; }
    .col-dot.amber { background: #f59e0b; }
    .col-dot.blue  { background: #3b82f6; }

    .col-label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #f1f5f9;
    }

    .col-count {
      margin-right: auto;
      background: #0f172a;
      border-radius: 999px;
      padding: 1px 9px;
      font-size: 0.75rem;
      color: #64748b;
    }

    .task-list { list-style: none; display: flex; flex-direction: column; gap: 6px; min-height: 40px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 0.88rem;
      cursor: default;
      transition: border-color 0.1s;
    }

    .task-item:hover { border-color: #334155; }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #475569;
    }

    .task-cb {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 2px solid #475569;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .task-cb.checked { background: #22c55e; border-color: #22c55e; }
    .task-cb.checked::after { content: '✓'; color: white; font-size: 10px; font-weight: 700; }

    .task-text { flex: 1; word-break: break-word; }

    .task-del {
      opacity: 0;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      transition: opacity 0.1s, color 0.1s;
    }

    .task-item:hover .task-del { opacity: 1; }
    .task-del:hover { color: #ef4444; }

    .add-task-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .add-task-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      color: #e2e8f0;
      font-size: 0.85rem;
      outline: none;
    }

    .add-task-input:focus { border-color: #60a5fa; }
    .add-task-input::placeholder { color: #475569; }

    .add-task-btn {
      background: #1d4ed8;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.1rem;
      padding: 0 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .add-task-btn:hover { background: #2563eb; }

    /* ─── CLOCK ─── */
    .clock {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    .clock span { color: #94a3b8; font-weight: 500; }
  </style>
</head>
<body>

<h1>הלוח שלי ✦</h1>
<div class="clock" id="clock"></div>

<!-- Links -->
<div class="section-title">קישורים מהירים</div>
<div class="links-grid" id="links-grid"></div>

<!-- Tasks -->
<div class="section-title">סדר יום</div>
<div class="tasks-layout">
  <div class="task-col" id="col-immediate">
    <div class="task-col-header">
      <div class="col-dot red"></div>
      <span class="col-label">מיידי 🔥</span>
      <span class="col-count" id="cnt-immediate">0</span>
    </div>
    <ul class="task-list" id="list-immediate"></ul>
    <div class="add-task-row">
      <input class="add-task-input" id="inp-immediate" placeholder="הוסף משימה..." />
      <button class="add-task-btn" onclick="addTask('immediate')">+</button>
    </div>
  </div>

  <div class="task-col" id="col-today">
    <div class="task-col-header">
      <div class="col-dot amber"></div>
      <span class="col-label">היום 📋</span>
      <span class="col-count" id="cnt-today">0</span>
    </div>
    <ul class="task-list" id="list-today"></ul>
    <div class="add-task-row">
      <input class="add-task-input" id="inp-today" placeholder="הוסף משימה..." />
      <button class="add-task-btn" onclick="addTask('today')">+</button>
    </div>
  </div>

  <div class="task-col" id="col-week">
    <div class="task-col-header">
      <div class="col-dot blue"></div>
      <span class="col-label">השבוע 📅</span>
      <span class="col-count" id="cnt-week">0</span>
    </div>
    <ul class="task-list" id="list-week"></ul>
    <div class="add-task-row">
      <input class="add-task-input" id="inp-week" placeholder="הוסף משימה..." />
      <button class="add-task-btn" onclick="addTask('week')">+</button>
    </div>
  </div>
</div>

<!-- Add Link Modal -->
<div class="modal-overlay" id="link-modal">
  <div class="modal">
    <h3>הוסף קישור</h3>
    <input id="modal-label" placeholder="שם (לדוגמה: Gmail)" />
    <input id="modal-url" placeholder="כתובת (https://...)" dir="ltr" />
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeModal()">ביטול</button>
      <button class="btn-primary" onclick="saveLink()">שמור</button>
    </div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────

  const DEFAULT_LINKS = [
    { label: 'Gmail',      url: 'https://mail.google.com' },
    { label: 'Drive',      url: 'https://drive.google.com' },
    { label: 'Calendar',   url: 'https://calendar.google.com' },
    { label: 'WhatsApp',   url: 'https://web.whatsapp.com' },
    { label: 'YouTube',    url: 'https://youtube.com' },
    { label: 'ChatGPT',    url: 'https://chatgpt.com' },
  ];

  const DEFAULT_TASKS = { immediate: [], today: [], week: [] };

  let links = JSON.parse(localStorage.getItem('my_links') || 'null') ?? DEFAULT_LINKS;
  let tasks = JSON.parse(localStorage.getItem('my_tasks') || 'null') ?? DEFAULT_TASKS;

  function save() {
    localStorage.setItem('my_links', JSON.stringify(links));
    localStorage.setItem('my_tasks', JSON.stringify(tasks));
  }

  // ── Clock ──────────────────────────────────────────────────────────────────

  const DAYS_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const day = DAYS_HE[now.getDay()];
    const date = now.getDate();
    const month = MONTHS_HE[now.getMonth()];
    document.getElementById('clock').innerHTML =
      `יום ${day}, ${date} ב${month} · <span>${h}:${m}</span>`;
  }

  updateClock();
  setInterval(updateClock, 10000);

  // ── Links ──────────────────────────────────────────────────────────────────

  function faviconUrl(url) {
    try { return `https://www.google.com/s2/favicons?sz=32&domain=${new URL(url).hostname}`; }
    catch { return ''; }
  }

  function renderLinks() {
    const grid = document.getElementById('links-grid');
    grid.innerHTML = '';
    links.forEach((lnk, i) => {
      const a = document.createElement('a');
      a.className = 'link-chip';
      a.href = lnk.url;
      a.target = '_blank';
      a.rel = 'noopener';

      const del = document.createElement('button');
      del.className = 'del-link';
      del.textContent = '×';
      del.onclick = (e) => { e.preventDefault(); e.stopPropagation(); deleteLink(i); };

      const fav = document.createElement('img');
      fav.className = 'favicon';
      fav.src = faviconUrl(lnk.url);
      fav.onerror = () => fav.style.display = 'none';

      const txt = document.createElement('span');
      txt.textContent = lnk.label;

      a.append(del, fav, txt);
      grid.appendChild(a);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-link-btn';
    addBtn.textContent = '+ הוסף קישור';
    addBtn.onclick = openModal;
    grid.appendChild(addBtn);
  }

  function deleteLink(i) { links.splice(i, 1); save(); renderLinks(); }

  function openModal() { document.getElementById('link-modal').classList.add('open'); }
  function closeModal() {
    document.getElementById('link-modal').classList.remove('open');
    document.getElementById('modal-label').value = '';
    document.getElementById('modal-url').value = '';
  }

  function saveLink() {
    const label = document.getElementById('modal-label').value.trim();
    let url = document.getElementById('modal-url').value.trim();
    if (!label || !url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    links.push({ label, url });
    save();
    renderLinks();
    closeModal();
  }

  document.getElementById('link-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  document.getElementById('modal-url').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveLink();
  });

  // ── Tasks ──────────────────────────────────────────────────────────────────

  function renderTasks() {
    ['immediate','today','week'].forEach(col => {
      const list = document.getElementById('list-' + col);
      list.innerHTML = '';
      const colTasks = tasks[col] || [];
      colTasks.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (t.done ? ' done' : '');

        const cb = document.createElement('div');
        cb.className = 'task-cb' + (t.done ? ' checked' : '');
        cb.onclick = () => toggleTask(col, i);

        const txt = document.createElement('span');
        txt.className = 'task-text';
        txt.textContent = t.text;

        const del = document.createElement('button');
        del.className = 'task-del';
        del.textContent = '×';
        del.onclick = () => deleteTask(col, i);

        li.append(cb, txt, del);
        list.appendChild(li);
      });

      document.getElementById('cnt-' + col).textContent = colTasks.filter(t => !t.done).length;
    });
  }

  function addTask(col) {
    const inp = document.getElementById('inp-' + col);
    const text = inp.value.trim();
    if (!text) return;
    tasks[col].push({ text, done: false });
    save();
    renderTasks();
    inp.value = '';
    inp.focus();
  }

  function toggleTask(col, i) {
    tasks[col][i].done = !tasks[col][i].done;
    save();
    renderTasks();
  }

  function deleteTask(col, i) {
    tasks[col].splice(i, 1);
    save();
    renderTasks();
  }

  ['immediate','today','week'].forEach(col => {
    document.getElementById('inp-' + col).addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask(col);
    });
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  renderLinks();
  renderTasks();
</script>
</body>
</html>
